<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anusmarak</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2311111b'/><rect x='7' y='7' width='18' height='18' rx='3' fill='%23181825' stroke='%23a6adc8' stroke-width='1.5'/><circle cx='10' cy='10' r='1.5' fill='%23f9e2af'/><rect x='11' y='11' width='10' height='10' rx='1' fill='%2311111b' stroke='%2345475a' stroke-width='1.5'/><circle cx='16' cy='16' r='2' fill='%2374c7ec' fill-opacity='0.6'/><path d='M7 11h-3M7 16h-3M7 21h-3M25 11h3M25 16h3M25 21h3M11 7v-3M16 7v-3M21 7v-3M11 25v3M16 25v3M21 25v3' stroke='%237f849c' stroke-width='1.5' stroke-linecap='round'/></svg>" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#0a0c0f;--sur:#111318;--sur-elev:#161922;--bor:#1e2229;--y:#e2b714;--b:#47c5ff;--r:#ff6b47;--g:#47ffb0;--mut:#4a5260;--text:#d4dae6;--dim:#6b7585}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;line-height:1.6;min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.012) 2px,rgba(255,255,255,.012) 4px);pointer-events:none;z-index:9999}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px}
    header{position:sticky;top:0;z-index:100;background:rgba(10,12,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--bor);padding:0 28px;display:flex;align-items:center;gap:12px;height:56px}
    .LOGO{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:.08em;color:var(--y);text-transform:uppercase;flex-shrink:0}
    .HLFT{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
    .PIPE{color:var(--bor)}
    .STDOT{width:8px;height:8px;border-radius:50%;display:inline-block;transition:background-color .3s}
    .DOTG{background:var(--g);box-shadow:0 0 6px var(--g)} .DOTY{background:var(--y);box-shadow:0 0 6px var(--y)} .DOTR{background:var(--r);box-shadow:0 0 6px var(--r)}
    .HVAL{color:var(--text);font-weight:500}
    .HUPT{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
    main{padding:28px;display:flex;flex-direction:column;gap:20px;max-width:1400px;margin:0 auto}
    .SC{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
    .SCTTL{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
    .SCLN{flex:1;height:1px;background:var(--bor)}
    .KPIRW{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .KPI{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:14px 18px;position:relative;overflow:hidden}
    .KPILBL{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
    .KPIVAL{font-family:'Syne',sans-serif;font-weight:700;font-size:22px;line-height:1;margin-bottom:4px}
    .KPISB{font-size:10px;color:var(--dim)}

    .PWRRW{display:grid;grid-template-columns:1fr;gap:12px}
    .BTNPS{width:100%;background:transparent;border:1px solid #2a354a;color:#47c5ff;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:3px;transition:all .2s}
    .BTNPS:hover{background:rgba(71,197,255,.1);border-color:#47c5ff;box-shadow:0 0 24px rgba(71,197,255,.12)}
    .material-icons-sharp{font-size:16px}

    .MACCRD{background:var(--sur);border:1px solid var(--bor);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column}
    .MACHDR{display:flex;align-items:center;background:#0d1117;border-bottom:1px solid var(--bor);padding:0 14px;height:38px}
    .MACDOTS{display:flex;gap:7px;align-items:center;margin-right:16px}
    .MACDOT{width:10px;height:10px;border-radius:50%}
    .MACDOT.RED{background:#ff5f56} .MACDOT.YLW{background:#ffbd2e} .MACDOT.GRN{background:#27c93f}
    .MACTTL{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-left:auto;font-weight:500}
    .TERMTABS{display:flex;gap:4px;flex:1}
    .TTAB{background:transparent;border:none;color:var(--dim);font-family:'DM Mono',monospace;font-size:11px;padding:4px 12px;cursor:pointer;border-radius:4px}
    .TTAB:hover{color:var(--text);background:rgba(255,255,255,.03)}
    .TTAB.ACTIVE{color:var(--text);background:var(--sur-elev);font-weight:500}
    .TERMBODY{padding:14px 16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);background:#080a0e;min-height:220px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;position:relative}
    .SKLBOX{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;gap:10px;color:var(--dim);border:1px dashed var(--bor);border-radius:6px;background:rgba(255,255,255,.01)}
    @keyframes Shimmer{to{background-position:200% 0}}
    .SKLBAR{width:120px;height:12px;background:linear-gradient(90deg,var(--sur) 25%,var(--bor) 50%,var(--sur) 75%) 0 0/200% 100%;animation:Shimmer 1.5s infinite;border-radius:3px}
    .TERM{min-height:220px;max-height:320px;position:relative}
    .TERMFL{position:absolute;inset:0;background:rgba(10,12,15,.94);backdrop-filter:blur(4px);border:2px dashed var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
    .TERM.DRAG .TERMFL{opacity:1;pointer-events:auto}
    .CLIWRP{background:#0d1117;padding:6px 12px;border-top:1px solid var(--bor);display:flex;align-items:center;gap:8px}
    .CLIP{color:var(--y);font-weight:700;font-size:12px}
    .CLIIP{flex:1;background:transparent;border:none;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none}
    .CLIBTN{background:transparent;border:none;color:var(--dim);padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .CLIBTN:hover{color:var(--y)}
  </style>
</head>
<body>
  <header>
    <div class="LOGO">Anusmarak</div>
    <div class="HLFT">
      <span class="PIPE">|</span>
      <span class="STDOT DOTR" id="HDot"></span>
      <span class="HVAL" id="HLat">-- ms</span>
      <span class="PIPE">|</span>
      <span class="HVAL" id="RSSI">-- dBm</span>
    </div>
    <div class="HUPT" id="HUPT">00:00:00</div>
  </header>

  <main>
    <section>
      <div class="SC"><span class="SCTTL">System Telemetry</span><div class="SCLN"></div></div>
      <div class="KPIRW">
        <div class="KPI"><div class="KPILBL">Expression</div><div class="KPIVAL" style="color:var(--r)" id="Expression">--</div><div class="KPISB">Mood</div></div>
        <div class="KPI"><div class="KPILBL">Battery</div><div class="KPIVAL" style="color:var(--r)" id="Battery">-- %</div><div class="KPISB" id="Voltage">-- V</div></div>
        <div class="KPI"><div class="KPILBL">Temperature</div><div class="KPIVAL" style="color:var(--r)" id="Temperature">-- °C</div><div class="KPISB">Chip Temperature</div></div>
        <div class="KPI"><div class="KPILBL">Exceptions</div><div class="KPIVAL" style="color:var(--r)" id="Exceptions">-- Exceptions</div><div class="KPISB" id="ExceptionCount">0 Exceptions</div></div>
      </div>
    </section>

    <section>
      <div class="SC"><span class="SCTTL">USD Trend</span><div class="SCLN"></div></div>
      <div class="MACCRD">
        <div class="MACHDR"><div class="MACDOTS"><div class="MACDOT RED"></div><div class="MACDOT YLW"></div><div class="MACDOT GRN"></div></div><span class="MACTTL">USD Distance (60s Window)</span></div>
        <div style="padding:14px 16px;background:#080a0e"><canvas id="DistanceChart" height="110"></canvas></div>
      </div>
    </section>

    <section>
      <div class="SC"><span class="SCTTL">Temperature Trend</span><div class="SCLN"></div></div>
      <div class="MACCRD">
        <div class="MACHDR"><div class="MACDOTS"><div class="MACDOT RED"></div><div class="MACDOT YLW"></div><div class="MACDOT GRN"></div></div><span class="MACTTL">Temperature (60s Window)</span></div>
        <div style="padding:14px 16px;background:#080a0e"><canvas id="TemperatureChart" height="110"></canvas></div>
      </div>
    </section>

    <section>
        <div class="SC"><span class="SCTTL">Archives</span><div class="SCLN"></div></div>
        <div class="MACCRD">
            <div class="MACHDR">
            <div class="MACDOTS"><div class="MACDOT RED"></div><div class="MACDOT YLW"></div><div class="MACDOT GRN"></div></div>
            <div class="TERMTABS">
                <button class="TTAB ACTIVE" onclick="LDLG('Orchestrator', event)">Orchestrator</button>
                <button class="TTAB" onclick="LDLG('Hardware', event)">Hardware</button>
            </div>
            <span id="LogMeta" style="font-size:10px;color:var(--dim)">/littlefs/Logs/</span>
        </div>
        <div class="TERMBODY" id="LogTerminal">
            <div class="SKLBOX"><div class="SKLBAR"></div><span>No Logs Recorded</span></div>
        </div>
            <input type="file" id="NativeFileInput" accept=".bin" style="display:none" onchange="this.files.length&&PRSBIN(this.files[0])"/>
            <div style="background:#0d1117;border-top:1px solid var(--bor);height:38px;padding:0 14px;display:flex;justify-content:flex-end;align-items:center;">
            <button style="background:transparent;border:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:11px;" onclick="document.getElementById('NativeFileInput').click()">
            <span>OTA</span>
            <span class="material-icons-sharp" style="font-size:16px">attach_file</span>
            </button>
        </div>
      </div>
    </section>

    <section>
      <div class="SC"><span class="SCTTL">Power Controls</span><div class="SCLN"></div></div>
      <div class="PWRRW"> <button class="BTNPS" onclick="SNDCMD('/Restart')"><span class="material-icons-sharp">restart_alt</span>Restart</button> </div>
    </section>

  </main>
  <script>
        Chart.defaults.color = '#6b7585'; Chart.defaults.borderColor = '#1e2229'; Chart.defaults.font.family = "'DM Mono', monospace"; Chart.defaults.font.size = 11;

        const MAXPTS = 60; const TIMELBLS = Array(MAXPTS).fill(''); const DSTDAT = Array(MAXPTS).fill(null); const TEMPDAT = Array(MAXPTS).fill(null);

        const DSTC = new Chart(document.getElementById('DistanceChart'), {
          type: 'line', data: { labels: TIMELBLS, datasets: [{ data: DSTDAT, borderColor: '#47c5ff', backgroundColor: 'rgba(71,197,255,.07)', fill: true, tension: .2, pointRadius: 0, borderWidth: 1.5, spanGaps: true }] },
          options: { responsive: true, animation: { duration: 150 }, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(30,34,41,.6)' }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: 'rgba(30,34,41,.6)' }, min: 0, max: 400 } } }
        });

        const TEMPC = new Chart(document.getElementById('TemperatureChart'), {
            type: 'line', data: { labels: TIMELBLS, datasets: [{ data: TEMPDAT, borderColor: '#ffb047', backgroundColor: 'rgba(255,176,71,.07)', fill: true, tension: .2, pointRadius: 0, borderWidth: 1.5, spanGaps: true }] },
            options: { responsive: true, animation: { duration: 150 }, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(30,34,41,.6)' }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: 'rgba(30,34,41,.6)' }, min: 0, max: 50, ticks: { stepSize: 5 } } } }
        });

        let CL = 'Orchestrator';
        let LAST_TELEMETRY = 0;

        const LDLG = async (NAM, EV) => {
          if (EV) document.querySelectorAll('.TTAB').forEach(B => B.classList.toggle('ACTIVE', B === EV.currentTarget));
          CL = NAM;
          const BOX = document.getElementById('LogTerminal');
          if (Date.now() - LAST_TELEMETRY > 4000) return;
          try {
            const RES = await fetch(`/Logs/${NAM}.log`);
            const TXT = RES.ok ? (await RES.text()).trim() : '';
            const HTML = TXT || '<div class="SKLBOX"><div class="SKLBAR"></div><span>No Logs Recorded</span></div>';
            if (BOX.innerHTML !== HTML) {
              const BTM = BOX.scrollHeight - BOX.scrollTop <= BOX.clientHeight + 40;
              BOX.innerHTML = HTML;
              if (BTM) BOX.scrollTop = BOX.scrollHeight;
            }
          } catch {}
        };

        setInterval(() => CL && LDLG(CL), 3000);

        const RST = () => {
          document.getElementById('HDot').className = 'STDOT DOTR';
          document.getElementById('HLat').textContent = '-- ms';
          document.getElementById('RSSI').textContent = '-- dBm';
          document.getElementById('Expression').textContent = '--';
          document.getElementById('Battery').textContent = '-- %';
          document.getElementById('Voltage').textContent = '-- V';
          document.getElementById('Temperature').textContent = '-- °C';
          document.getElementById('Exceptions').textContent = '--';
          document.getElementById('HUPT').textContent = 'OFFLINE';
          document.getElementById('Expression').style.color = 'var(--r)'
          document.getElementById('Battery').style.color = 'var(--r)'
          document.getElementById('Temperature').style.color = 'var(--r)'
          document.getElementById('Exceptions').style.color = 'var(--r)'
        };

        const UPDTDSH = DAT => {
          if (!DAT) return;
          LAST_TELEMETRY = Date.now();
          if (DAT.Latency != null) document.getElementById('HLat').textContent = DAT.Latency + ' ms';
          if (DAT.RSSI != null) { document.getElementById('RSSI').textContent = DAT.RSSI + ' dBm'; document.getElementById('HDot').className = 'STDOT ' + (DAT.RSSI > -65 ? 'DOTG' : DAT.RSSI > -80 ? 'DOTY' : 'DOTR'); }
          if (DAT.Expression != null) { document.getElementById('Expression').textContent = DAT.Expression; document.getElementById('Expression').style.color = DAT.Expression === 'DEAD' ? 'var(--r)' : (DAT.Expression === 'WORRIED' ? 'var(--y)' : (DAT.Expression === 'SLEEPY' ? 'var(--b)' : 'var(--g)')); }
          if (DAT.Exceptions != null) { document.getElementById('Exceptions').textContent = DAT.Exceptions;
              let CNT = DAT.Exceptions === 'None' ? 0 : DAT.Exceptions.split(',').length; document.getElementById('ExceptionCount').textContent = CNT + ' Exceptions'; document.getElementById('Exceptions').style.color = CNT === 0 ? 'var(--g)' : (CNT <= 2 ? 'var(--y)' : 'var(--r)');}
          if (DAT.BPCT != null && DAT.BVLT != null) { document.getElementById('Battery').textContent = DAT.BPCT + '%'; document.getElementById('Voltage').textContent = DAT.BVLT + ' V'; document.getElementById('Battery').style.color = DAT.BPCT > 50 ? 'var(--g)' : (DAT.BPCT > 20 ? 'var(--y)' : 'var(--r)');}
          if (DAT.Temperature != null) { document.getElementById('Temperature').textContent = DAT.Temperature + '°C'; document.getElementById('Temperature').style.color = DAT.Temperature < 60 ? 'var(--g)' : (DAT.Temperature < 75 ? 'var(--y)' : 'var(--r)');}
          if (DAT.Uptime != null) {
            let UPSEC = DAT.Uptime;
            const PAD = N => String(N).padStart(2, '0');
            document.getElementById('HUPT').textContent = `${PAD(Math.floor(UPSEC / 3600))}:${PAD(Math.floor((UPSEC % 3600) / 60))}:${PAD(UPSEC % 60)}`;
          }
          if (DAT.USD != null) { TIMELBLS.push(new Date().toLocaleTimeString()); TIMELBLS.shift(); DSTDAT.push(DAT.Exceptions.includes('USD') ? null : DAT.USD); DSTDAT.shift(); DSTC.update('none'); }
          if (DAT.Temperature != null) { TEMPDAT.push(DAT.Temperature); TEMPDAT.shift(); TEMPC.update('none'); }
        };

        setInterval(() => {
          if (Date.now() - LAST_TELEMETRY > 4000) {
            RST();
          }
        }, 1000);

        const SNDCMD = async URL => {
          if (!confirm(`Are you sure you want to execute: ${URL}?`)) return;
          try { await fetch(URL); } catch {}
        };

        const PRSBIN = F => {
          if (!F.name.endsWith('.bin')) return;
          const X = new XMLHttpRequest();
          X.open('POST', '/OTA', true);
          X.setRequestHeader('Content-Type', 'application/octet-stream');
          X.send(F);
        };

        setInterval(async () => { const T0 = performance.now(); try { const RES = await fetch('/Telemetry'); if (RES.ok) { const DAT = await RES.json(); DAT.Latency = Math.round(performance.now() - T0); UPDTDSH(DAT); } } catch {} }, 2000);
        LDLG('Orchestrator');
      </script>
</body>
</html>
